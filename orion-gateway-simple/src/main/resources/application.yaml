spring:
  application:
    name: orion-gateway-simple

server:
  port: 8080

# Orion Gateway 配置
orion:
  gateway:
    # 是否启用 Netty URI 清理功能
    enable-netty-uri-sanitizing: true
    # 是否启用网关访问日志
    enable-gateway-access-log: false
    # URI 清理配置
    uri-sanitizing:
      enabled: true
      path-patterns: /api/**,/service/**

# 日志配置
logging:
  level:
    root: INFO
    cn.techoc.oriongateway: DEBUG
